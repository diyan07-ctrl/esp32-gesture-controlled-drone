<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-labelledby="title desc">
<title id="title">Quad-X motor layout, top view</title><desc id="desc">M1 front-left clockwise, M2 front-right counterclockwise, M3 rear-right clockwise, M4 rear-left counterclockwise. Front points up.</desc>
