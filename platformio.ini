[platformio]
default_envs = glove, drone
src_dir = firmware
include_dir = firmware/common

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:glove]
build_src_filter = +<glove/src/>
build_flags = ${env.build_flags} -DBUILD_GLOVE

[env:drone]
build_src_filter = +<drone/src/>
build_flags = ${env.build_flags} -DBUILD_DRONE
