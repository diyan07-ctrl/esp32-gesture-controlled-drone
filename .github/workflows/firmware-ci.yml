name: Firmware and shared logic
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [glove, drone, motor_test, glove_sensors, drone_sensors]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e ${{ matrix.target }}
  logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: node tools/check_repository.mjs
      - run: python tools/run_host_tests.py
