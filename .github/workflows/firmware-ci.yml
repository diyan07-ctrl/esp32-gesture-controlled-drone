name: Firmware and shared logic
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [glove, drone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e ${{ matrix.target }}
  logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/check_repository.mjs
      - run: mkdir -p build && g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -pedantic -I firmware/common tests/unit/core_tests.cpp -o build/core_tests
      - run: ./build/core_tests
      - run: python -m unittest discover -s tests/unit -p test_tools.py -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I firmware/common simulation/tests/roll_model.cpp -o build/roll_model
      - run: ./build/roll_model
